{% extends "base.html" %}

{% block title %}Survey Platform{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="card" style="text-align: center; max-width: 500px;">
        <h1 style="color: #667eea; margin-bottom: 20px;">Survey Platform</h1>
        <p style="color: #666; font-size: 18px; margin-bottom: 30px;">
            欢迎使用 Survey Platform！这是一个功能完善的问卷系统。
        </p>
        {% if current_user.is_authenticated %}
            <p style="color: #333;">
                您已登录为 <strong>{{ current_user.username }}</strong>
            </p>
            <div style="margin-top: 20px;">
                <a href="{{ url_for('auth.logout') }}" class="btn-logout" style="display: inline-block; text-decoration: none;">退出登录</a>
            </div>
        {% else %}
            <div style="margin-top: 20px; display: flex; gap: 15px; justify-content: center;">
                <a href="{{ url_for('auth.login') }}" class="btn">立即登录</a>
                <a href="{{ url_for('auth.register') }}" class="btn" style="background: #27ae60;">免费注册</a>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
