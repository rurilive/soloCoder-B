{% extends "base.html" %}

{% block title %}添加分类 - 网络书签管理器{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        max-width: 600px;
        margin: 0 auto;
    }

    .form-header {
        margin-bottom: 30px;
    }

    .form-header h2 {
        color: #333;
        font-size: 24px;
        margin-bottom: 10px;
    }

    .form-header p {
        color: #666;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
    }

    .form-group label .required {
        color: #dc3545;
        margin-left: 2px;
    }

    .form-group input[type="text"],
    .form-group textarea,
    .form-group select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s;
        font-family: inherit;
        background: white;
    }

    .form-group input[type="text"]:focus,
    .form-group textarea:focus,
    .form-group select:focus {
        border-color: #667eea;
    }

    .form-group textarea {
        min-height: 100px;
        resize: vertical;
    }

    .form-group .help-text {
        color: #999;
        font-size: 12px;
        margin-top: 4px;
    }

    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 30px;
    }

    .btn-submit {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 12px 30px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.3s;
    }

    .btn-submit:hover {
        opacity: 0.9;
    }

    .btn-cancel {
        background: #e9ecef;
        color: #495057;
        padding: 12px 30px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.3s;
    }

    .btn-cancel:hover {
        background: #dde2e6;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <h2>➕ 添加新分类</h2>
        <p>创建分类来更好地组织您的书签</p>
    </div>

    <form method="POST" action="/categories/add">
        <div class="form-group">
            <label for="name">分类名称 <span class="required">*</span></label>
            <input type="text" id="name" name="name" placeholder="例如：技术资料、学习笔记" required>
        </div>

        <div class="form-group">
            <label for="parent_id">父分类</label>
            <select id="parent_id" name="parent_id">
                <option value="">-- 无父分类（作为顶级分类）--</option>
                {% for category in all_categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
            <p class="help-text">选择一个父分类可以创建层级结构</p>
        </div>

        <div class="form-group">
            <label for="description">描述</label>
            <textarea id="description" name="description" placeholder="简要描述这个分类的用途..."></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit">💾 保存分类</button>
            <a href="/categories" class="btn-cancel">取消</a>
        </div>
    </form>
</div>
{% endblock %}
