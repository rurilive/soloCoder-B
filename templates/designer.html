<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>低代码平台 - 表单设计器</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        .field-item {
            cursor: move;
            transition: all 0.2s ease;
        }
        .field-item:hover {
            transform: translateX(5px);
            background-color: #f3f4f6;
        }
        .dropzone {
            min-height: 300px;
            border: 2px dashed #d1d5db;
            transition: all 0.3s ease;
        }
        .dropzone.drag-over {
            border-color: #667eea;
            background-color: #f0f4ff;
        }
        .form-field {
            position: relative;
            transition: all 0.2s ease;
        }
        .form-field:hover {
            border-color: #667eea;
        }
        .form-field .field-actions {
            display: none;
        }
        .form-field:hover .field-actions {
            display: flex;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .tab-button.active {
            border-bottom-color: #667eea;
            color: #667eea;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="flex h-screen">
        <!-- 左侧组件面板 -->
        <div class="w-64 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-200">
                <h2 class="text-lg font-bold text-gray-800">
                    <i class="fas fa-puzzle-piece mr-2"></i>组件库
                </h2>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4">
                <div class="space-y-2">
                    <div class="field-item bg-gray-50 rounded-lg p-3 border border-gray-200" 
                         draggable="true" data-field-type="text">
                        <i class="fas fa-font mr-2 text-blue-500"></i>
                        <span>文本输入</span>
                    </div>
                    
                    <div class="field-item bg-gray-50 rounded-lg p-3 border border-gray-200" 
                         draggable="true" data-field-type="number">
                        <i class="fas fa-hashtag mr-2 text-green-500"></i>
                        <span>数字输入</span>
                    </div>
                    
                    <div class="field-item bg-gray-50 rounded-lg p-3 border border-gray-200" 
                         draggable="true" data-field-type="email">
                        <i class="fas fa-envelope mr-2 text-purple-500"></i>
                        <span>邮箱输入</span>
                    </div>
                    
                    <div class="field-item bg-gray-50 rounded-lg p-3 border border-gray-200" 
                         draggable="true" data-field-type="textarea">
                        <i class="fas fa-align-left mr-2 text-orange-500"></i>
                        <span>多行文本</span>
                    </div>
                    
                    <div class="field-item bg-gray-50 rounded-lg p-3 border border-gray-200" 
                         draggable="true" data-field-type="select">
                        <i class="fas fa-chevron-down mr-2 text-red-500"></i>
                        <span>下拉选择</span>
                    </div>
                    
                    <div class="field-item bg-gray-50 rounded-lg p-3 border border-gray-200" 
                         draggable="true" data-field-type="radio">
                        <i class="fas fa-dot-circle mr-2 text-indigo-500"></i>
                        <span>单选按钮</span>
                    </div>
                    
                    <div class="field-item bg-gray-50 rounded-lg p-3 border border-gray-200" 
                         draggable="true" data-field-type="checkbox">
                        <i class="fas fa-check-square mr-2 text-teal-500"></i>
                        <span>多选框</span>
                    </div>
                    
                    <div class="field-item bg-gray-50 rounded-lg p-3 border border-gray-200" 
                         draggable="true" data-field-type="date">
                        <i class="fas fa-calendar mr-2 text-pink-500"></i>
                        <span>日期选择</span>
                    </div>
                    
                    <div class="field-item bg-gray-50 rounded-lg p-3 border border-gray-200" 
                         draggable="true" data-field-type="file">
                        <i class="fas fa-upload mr-2 text-yellow-500"></i>
                        <span>文件上传</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 中间设计区域 -->
        <div class="flex-1 flex flex-col">
            <!-- 顶部工具栏 -->
            <div class="bg-white border-b border-gray-200 p-4 flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <a href="{{ url_for('index') }}" class="text-gray-600 hover:text-gray-800">
                        <i class="fas fa-arrow-left mr-2"></i>返回
                    </a>
                    <h1 class="text-xl font-bold text-gray-800" id="formTitle">新建表单</h1>
                </div>
                <div class="flex space-x-3">
                    <button onclick="previewForm()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition">
                        <i class="fas fa-eye mr-2"></i>预览
                    </button>
                    <button onclick="saveForm()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition">
                        <i class="fas fa-save mr-2"></i>保存
                    </button>
                </div>
            </div>

            <!-- 表单基本信息 -->
            <div class="bg-white border-b border-gray-200 p-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">表单名称</label>
                        <input type="text" id="formNameInput" placeholder="请输入表单名称" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">表单描述</label>
                        <input type="text" id="formDescriptionInput" placeholder="请输入表单描述" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    </div>
                </div>
            </div>

            <!-- 设计区域 -->
            <div class="flex-1 overflow-y-auto p-6">
                <div id="formDropzone" class="dropzone bg-white rounded-xl p-6">
                    <div id="emptyState" class="text-center py-12">
                        <i class="fas fa-mouse-pointer text-4xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500">从左侧拖拽组件到这里来构建表单</p>
                    </div>
                    <div id="fieldsContainer" class="space-y-4"></div>
                </div>
            </div>
        </div>

        <!-- 右侧属性面板 -->
        <div class="w-80 bg-white border-l border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-200">
                <h2 class="text-lg font-bold text-gray-800">
                    <i class="fas fa-cog mr-2"></i>属性配置
                </h2>
            </div>

            <!-- 属性面板内容 -->
            <div class="flex-1 overflow-y-auto p-4" id="propertyPanel">
                <div id="noSelection" class="text-center py-8">
                    <i class="fas fa-hand-pointer text-3xl text-gray-300 mb-3"></i>
                    <p class="text-gray-500 text-sm">点击选中表单中的字段来配置属性</p>
                </div>

                <div id="fieldProperties" class="hidden space-y-4">
                    <!-- 基本属性 -->
                    <div>
                        <h3 class="text-sm font-semibold text-gray-700 mb-2">基本属性</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-xs text-gray-600 mb-1">字段名称</label>
                                <input type="text" id="propName" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-500">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-600 mb-1">标签文本</label>
                                <input type="text" id="propLabel" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-500">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-600 mb-1">占位符</label>
                                <input type="text" id="propPlaceholder" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-500">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-600 mb-1">默认值</label>
                                <input type="text" id="propDefaultValue" class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-purple-500">
                            </div>
                        </div>
                    </div>

                    <!-- 校验规则 -->
                    <div>
                        <h3 class="text-sm font-semibold text-gray-700 mb-2">校验规则</h3>
                        <div class="space-y-3">
                            <div class="flex items-center">
                                <input type="checkbox" id="propRequired" class="mr-2">
                                <label for="propRequired" class="text-xs text-gray-600">必填</label>
                            </div>
                            <div id="validationOptions">
                                <div class="hidden" id="numberValidation">
                                    <div class="mb-2">
                                        <label class="block text-xs text-gray-600 mb-1">最小值</label>
                                        <input type="number" id="propMinValue" class="w-full px-3 py-2 text-sm border border-gray-300 rounded">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-gray-600 mb-1">最大值</label>
                                        <input type="number" id="propMaxValue" class="w-full px-3 py-2 text-sm border border-gray-300 rounded">
                                    </div>
                                </div>
                                <div class="hidden" id="textValidation">
                                    <div class="mb-2">
                                        <label class="block text-xs text-gray-600 mb-1">最小长度</label>
                                        <input type="number" id="propMinLength" class="w-full px-3 py-2 text-sm border border-gray-300 rounded">
                                    </div>
                                    <div class="mb-2">
                                        <label class="block text-xs text-gray-600 mb-1">最大长度</label>
                                        <input type="number" id="propMaxLength" class="w-full px-3 py-2 text-sm border border-gray-300 rounded">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-gray-600 mb-1">正则表达式</label>
                                        <input type="text" id="propPattern" class="w-full px-3 py-2 text-sm border border-gray-300 rounded">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 选项配置（针对选择类组件） -->
                    <div id="optionsSection" class="hidden">
                        <h3 class="text-sm font-semibold text-gray-700 mb-2">选项配置</h3>
                        <div id="optionsList" class="space-y-2 mb-3"></div>
                        <button onclick="addOption()" class="text-xs text-purple-600 hover:text-purple-800">
                            <i class="fas fa-plus mr-1"></i>添加选项
                        </button>
                    </div>

                    <!-- 联动规则 -->
                    <div>
                        <h3 class="text-sm font-semibold text-gray-700 mb-2">联动规则</h3>
                        <div id="linkageRules" class="space-y-2 mb-3"></div>
                        <button onclick="addLinkageRule()" class="text-xs text-purple-600 hover:text-purple-800">
                            <i class="fas fa-plus mr-1"></i>添加联动规则
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 预览模态框 -->
    <div id="previewModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl w-full max-w-4xl max-h-[90vh] overflow-hidden">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800">表单预览</h3>
                <button onclick="closePreview()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[calc(90vh-80px)]" id="previewContent"></div>
        </div>
    </div>

    <script>
        let formFields = [];
        let selectedFieldIndex = null;
        let editFormId = null;
        let fieldCounter = 0;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            editFormId = urlParams.get('edit');
            
            if (editFormId) {
                loadFormData(editFormId);
            }
            
            initDragAndDrop();
            initPropertyListeners();
        });

        async function loadFormData(formId) {
            try {
                const response = await fetch(`/api/forms/${formId}`);
                const formData = await response.json();
                
                document.getElementById('formNameInput').value = formData.name;
                document.getElementById('formDescriptionInput').value = formData.description || '';
                document.getElementById('formTitle').textContent = '编辑表单: ' + formData.name;
                
                if (formData.schema && formData.schema.fields) {
                    formFields = formData.schema.fields;
                    fieldCounter = formFields.length;
                    renderFields();
                }
            } catch (error) {
                console.error('Error loading form:', error);
                alert('加载表单失败');
            }
        }

        function initDragAndDrop() {
            const dropzone = document.getElementById('formDropzone');
            const fieldItems = document.querySelectorAll('.field-item');

            fieldItems.forEach(item => {
                item.addEventListener('dragstart', function(e) {
                    e.dataTransfer.setData('fieldType', this.dataset.fieldType);
                });
            });

            dropzone.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('drag-over');
            });

            dropzone.addEventListener('dragleave', function(e) {
                this.classList.remove('drag-over');
            });

            dropzone.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('drag-over');
                
                const fieldType = e.dataTransfer.getData('fieldType');
                if (fieldType) {
                    addField(fieldType);
                }
            });
        }

        function getFieldIcon(type) {
            const icons = {
                text: 'fa-font',
                number: 'fa-hashtag',
                email: 'fa-envelope',
                textarea: 'fa-align-left',
                select: 'fa-chevron-down',
                radio: 'fa-dot-circle',
                checkbox: 'fa-check-square',
                date: 'fa-calendar',
                file: 'fa-upload'
            };
            return icons[type] || 'fa-font';
        }

        function getFieldLabel(type) {
            const labels = {
                text: '文本输入',
                number: '数字输入',
                email: '邮箱输入',
                textarea: '多行文本',
                select: '下拉选择',
                radio: '单选按钮',
                checkbox: '多选框',
                date: '日期选择',
                file: '文件上传'
            };
            return labels[type] || '未知组件';
        }

        function addField(type) {
            fieldCounter++;
            const field = {
                id: `field_${fieldCounter}`,
                name: `field_${fieldCounter}`,
                type: type,
                label: getFieldLabel(type) + ' ' + fieldCounter,
                placeholder: '',
                defaultValue: '',
                required: false,
                options: [],
                validation: {},
                linkage: []
            };

            if (['select', 'radio', 'checkbox'].includes(type)) {
                field.options = [
                    { value: 'option1', label: '选项1' },
                    { value: 'option2', label: '选项2' }
                ];
            }

            formFields.push(field);
            renderFields();
        }

        function renderFields() {
            const container = document.getElementById('fieldsContainer');
            const emptyState = document.getElementById('emptyState');

            if (formFields.length === 0) {
                emptyState.classList.remove('hidden');
                container.innerHTML = '';
                return;
            }

            emptyState.classList.add('hidden');
            
            container.innerHTML = formFields.map((field, index) => `
                <div class="form-field bg-gray-50 border-2 border-gray-200 rounded-lg p-4 ${selectedFieldIndex === index ? 'border-purple-500' : ''}"
                     onclick="selectField(${index})"
                     data-index="${index}">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center mb-2">
                                <i class="fas ${getFieldIcon(field.type)} text-gray-500 mr-2"></i>
                                <span class="font-medium text-gray-800">${field.label}</span>
                                <span class="text-xs text-gray-400 ml-2">(${field.name})</span>
                                ${field.required ? '<span class="text-red-500 ml-1">*</span>' : ''}
                            </div>
                            <div class="text-sm text-gray-500">
                                类型: ${getFieldLabel(field.type)}
                                ${field.placeholder ? ` | 占位符: ${field.placeholder}` : ''}
                            </div>
                            ${field.options && field.options.length > 0 ? `
                                <div class="text-xs text-gray-400 mt-1">
                                    选项: ${field.options.map(o => o.label).join(', ')}
                                </div>
                            ` : ''}
                        </div>
                        <div class="field-actions flex space-x-2">
                            <button onclick="event.stopPropagation(); moveField(${index}, -1)" 
                                    class="text-gray-400 hover:text-gray-600 ${index === 0 ? 'opacity-50 cursor-not-allowed' : ''}"
                                    ${index === 0 ? 'disabled' : ''}>
                                <i class="fas fa-arrow-up"></i>
                            </button>
                            <button onclick="event.stopPropagation(); moveField(${index}, 1)" 
                                    class="text-gray-400 hover:text-gray-600 ${index === formFields.length - 1 ? 'opacity-50 cursor-not-allowed' : ''}"
                                    ${index === formFields.length - 1 ? 'disabled' : ''}>
                                <i class="fas fa-arrow-down"></i>
                            </button>
                            <button onclick="event.stopPropagation(); duplicateField(${index})" 
                                    class="text-gray-400 hover:text-gray-600">
                                <i class="fas fa-copy"></i>
                            </button>
                            <button onclick="event.stopPropagation(); deleteField(${index})" 
                                    class="text-red-400 hover:text-red-600">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function selectField(index) {
            selectedFieldIndex = index;
            renderFields();
            showFieldProperties(formFields[index]);
        }

        function showFieldProperties(field) {
            document.getElementById('noSelection').classList.add('hidden');
            document.getElementById('fieldProperties').classList.remove('hidden');

            document.getElementById('propName').value = field.name || '';
            document.getElementById('propLabel').value = field.label || '';
            document.getElementById('propPlaceholder').value = field.placeholder || '';
            document.getElementById('propDefaultValue').value = field.defaultValue || '';
            document.getElementById('propRequired').checked = field.required || false;

            const numberValidation = document.getElementById('numberValidation');
            const textValidation = document.getElementById('textValidation');
            const optionsSection = document.getElementById('optionsSection');

            if (field.type === 'number') {
                numberValidation.classList.remove('hidden');
                textValidation.classList.add('hidden');
                document.getElementById('propMinValue').value = field.validation?.min || '';
                document.getElementById('propMaxValue').value = field.validation?.max || '';
            } else if (['text', 'email', 'textarea'].includes(field.type)) {
                numberValidation.classList.add('hidden');
                textValidation.classList.remove('hidden');
                document.getElementById('propMinLength').value = field.validation?.minLength || '';
                document.getElementById('propMaxLength').value = field.validation?.maxLength || '';
                document.getElementById('propPattern').value = field.validation?.pattern || '';
            } else {
                numberValidation.classList.add('hidden');
                textValidation.classList.add('hidden');
            }

            if (['select', 'radio', 'checkbox'].includes(field.type)) {
                optionsSection.classList.remove('hidden');
                renderOptions(field.options);
            } else {
                optionsSection.classList.add('hidden');
            }

            renderLinkageRules(field.linkage || []);
        }

        function renderOptions(options) {
            const container = document.getElementById('optionsList');
            container.innerHTML = options.map((option, index) => `
                <div class="flex items-center space-x-2">
                    <input type="text" value="${option.value}" placeholder="值" 
                           class="flex-1 px-2 py-1 text-xs border border-gray-300 rounded"
                           onchange="updateOption(${index}, 'value', this.value)">
                    <input type="text" value="${option.label}" placeholder="显示文本" 
                           class="flex-1 px-2 py-1 text-xs border border-gray-300 rounded"
                           onchange="updateOption(${index}, 'label', this.value)">
                    <button onclick="removeOption(${index})" class="text-red-400 hover:text-red-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
        }

        function renderLinkageRules(rules) {
            const container = document.getElementById('linkageRules');
            const fieldNames = formFields.map(f => ({ value: f.name, label: f.label }));
            
            container.innerHTML = rules.map((rule, index) => `
                <div class="bg-gray-50 p-3 rounded text-xs space-y-2">
                    <div class="flex items-center space-x-2">
                        <span>当</span>
                        <select class="px-2 py-1 border border-gray-300 rounded"
                                onchange="updateLinkageRule(${index}, 'triggerField', this.value)">
                            ${fieldNames.map(f => `<option value="${f.value}" ${rule.triggerField === f.value ? 'selected' : ''}>${f.label}</option>`).join('')}
                        </select>
                        <select class="px-2 py-1 border border-gray-300 rounded"
                                onchange="updateLinkageRule(${index}, 'condition', this.value)">
                            <option value="equals" ${rule.condition === 'equals' ? 'selected' : ''}>等于</option>
                            <option value="notEquals" ${rule.condition === 'notEquals' ? 'selected' : ''}>不等于</option>
                            <option value="contains" ${rule.condition === 'contains' ? 'selected' : ''}>包含</option>
                            <option value="isEmpty" ${rule.condition === 'isEmpty' ? 'selected' : ''}>为空</option>
                            <option value="isNotEmpty" ${rule.condition === 'isNotEmpty' ? 'selected' : ''}>不为空</option>
                        </select>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span>值:</span>
                        <input type="text" value="${rule.triggerValue || ''}" placeholder="触发值"
                               class="flex-1 px-2 py-1 border border-gray-300 rounded"
                               onchange="updateLinkageRule(${index}, 'triggerValue', this.value)">
                    </div>
                    <div class="flex items-center space-x-2">
                        <span>则</span>
                        <select class="px-2 py-1 border border-gray-300 rounded"
                                onchange="updateLinkageRule(${index}, 'action', this.value)">
                            <option value="show" ${rule.action === 'show' ? 'selected' : ''}>显示</option>
                            <option value="hide" ${rule.action === 'hide' ? 'selected' : ''}>隐藏</option>
                            <option value="enable" ${rule.action === 'enable' ? 'selected' : ''}>启用</option>
                            <option value="disable" ${rule.action === 'disable' ? 'selected' : ''}>禁用</option>
                            <option value="setRequired" ${rule.action === 'setRequired' ? 'selected' : ''}>设为必填</option>
                        </select>
                        <select class="px-2 py-1 border border-gray-300 rounded"
                                onchange="updateLinkageRule(${index}, 'targetField', this.value)">
                            ${fieldNames.map(f => `<option value="${f.value}" ${rule.targetField === f.value ? 'selected' : ''}>${f.label}</option>`).join('')}
                        </select>
                    </div>
                    <button onclick="removeLinkageRule(${index})" class="text-red-400 hover:text-red-600">
                        <i class="fas fa-trash mr-1"></i>删除规则
                    </button>
                </div>
            `).join('');
        }

        function initPropertyListeners() {
            const props = ['propName', 'propLabel', 'propPlaceholder', 'propDefaultValue'];
            props.forEach(prop => {
                document.getElementById(prop).addEventListener('input', function() {
                    if (selectedFieldIndex !== null) {
                        const fieldKey = prop.replace('prop', '').charAt(0).toLowerCase() + prop.replace('prop', '').slice(1);
                        formFields[selectedFieldIndex][fieldKey] = this.value;
                        renderFields();
                    }
                });
            });

            document.getElementById('propRequired').addEventListener('change', function() {
                if (selectedFieldIndex !== null) {
                    formFields[selectedFieldIndex].required = this.checked;
                    renderFields();
                }
            });

            ['propMinValue', 'propMaxValue', 'propMinLength', 'propMaxLength', 'propPattern'].forEach(prop => {
                document.getElementById(prop).addEventListener('input', function() {
                    if (selectedFieldIndex !== null) {
                        const field = formFields[selectedFieldIndex];
                        if (!field.validation) field.validation = {};
                        
                        const key = prop.replace('prop', '').charAt(0).toLowerCase() + prop.replace('prop', '').slice(1);
                        if (this.value === '') {
                            delete field.validation[key];
                        } else {
                            field.validation[key] = this.value;
                        }
                    }
                });
            });
        }

        function addOption() {
            if (selectedFieldIndex !== null) {
                const field = formFields[selectedFieldIndex];
                const newIndex = field.options.length + 1;
                field.options.push({ value: `option${newIndex}`, label: `选项${newIndex}` });
                renderOptions(field.options);
                renderFields();
            }
        }

        function updateOption(index, key, value) {
            if (selectedFieldIndex !== null) {
                formFields[selectedFieldIndex].options[index][key] = value;
                renderFields();
            }
        }

        function removeOption(index) {
            if (selectedFieldIndex !== null && formFields[selectedFieldIndex].options.length > 1) {
                formFields[selectedFieldIndex].options.splice(index, 1);
                renderOptions(formFields[selectedFieldIndex].options);
                renderFields();
            }
        }

        function addLinkageRule() {
            if (selectedFieldIndex !== null) {
                const field = formFields[selectedFieldIndex];
                if (!field.linkage) field.linkage = [];
                
                const firstField = formFields[0];
                field.linkage.push({
                    triggerField: firstField?.name || '',
                    condition: 'equals',
                    triggerValue: '',
                    action: 'show',
                    targetField: field.name
                });
                
                renderLinkageRules(field.linkage);
            }
        }

        function updateLinkageRule(index, key, value) {
            if (selectedFieldIndex !== null) {
                formFields[selectedFieldIndex].linkage[index][key] = value;
            }
        }

        function removeLinkageRule(index) {
            if (selectedFieldIndex !== null) {
                formFields[selectedFieldIndex].linkage.splice(index, 1);
                renderLinkageRules(formFields[selectedFieldIndex].linkage);
            }
        }

        function moveField(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= formFields.length) return;
            
            [formFields[index], formFields[newIndex]] = [formFields[newIndex], formFields[index]];
            
            if (selectedFieldIndex === index) {
                selectedFieldIndex = newIndex;
            } else if (selectedFieldIndex === newIndex) {
                selectedFieldIndex = index;
            }
            
            renderFields();
        }

        function duplicateField(index) {
            const field = JSON.parse(JSON.stringify(formFields[index]));
            fieldCounter++;
            field.id = `field_${fieldCounter}`;
            field.name = `field_${fieldCounter}`;
            field.label = field.label + ' (副本)';
            
            formFields.splice(index + 1, 0, field);
            renderFields();
        }

        function deleteField(index) {
            if (!confirm('确定要删除这个字段吗？')) return;
            
            formFields.splice(index, 1);
            
            if (selectedFieldIndex === index) {
                selectedFieldIndex = null;
                document.getElementById('noSelection').classList.remove('hidden');
                document.getElementById('fieldProperties').classList.add('hidden');
            } else if (selectedFieldIndex > index) {
                selectedFieldIndex--;
            }
            
            renderFields();
        }

        async function saveForm() {
            const name = document.getElementById('formNameInput').value.trim();
            const description = document.getElementById('formDescriptionInput').value.trim();

            if (!name) {
                alert('请输入表单名称');
                return;
            }

            const formData = {
                name: name,
                description: description,
                schema: {
                    fields: formFields.map(field => ({
                        name: field.name,
                        type: field.type,
                        label: field.label,
                        placeholder: field.placeholder,
                        defaultValue: field.defaultValue,
                        required: field.required,
                        options: field.options,
                        validation: field.validation || {}
                    }))
                },
                validation_rules: {},
                linkage_rules: {}
            };

            formFields.forEach(field => {
                formData.validation_rules[field.name] = {
                    required: field.required,
                    ...(field.validation || {})
                };
                
                if (field.linkage && field.linkage.length > 0) {
                    formData.linkage_rules[field.name] = field.linkage;
                }
            });

            try {
                let response;
                if (editFormId) {
                    response = await fetch(`/api/forms/${editFormId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                } else {
                    response = await fetch('/api/forms', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                }

                if (response.ok) {
                    const result = await response.json();
                    alert('保存成功！');
                    if (!editFormId) {
                        window.location.href = '/designer?edit=' + result.id;
                    } else {
                        document.getElementById('formTitle').textContent = '编辑表单: ' + name;
                    }
                } else {
                    alert('保存失败，请重试');
                }
            } catch (error) {
                console.error('Error saving form:', error);
                alert('保存失败，请重试');
            }
        }

        function previewForm() {
            const name = document.getElementById('formNameInput').value.trim() || '表单预览';
            const description = document.getElementById('formDescriptionInput').value.trim();

            const previewContent = generateFormPreview(name, description, formFields);
            document.getElementById('previewContent').innerHTML = previewContent;
            document.getElementById('previewModal').classList.remove('hidden');
        }

        function generateFormPreview(name, description, fields) {
            let html = `
                <h2 class="text-2xl font-bold text-gray-800 mb-2">${name}</h2>
                ${description ? `<p class="text-gray-600 mb-6">${description}</p>` : ''}
                <form id="previewForm" class="space-y-6">
            `;

            fields.forEach(field => {
                const requiredMark = field.required ? '<span class="text-red-500 ml-1">*</span>' : '';
                html += `<div class="form-group" data-field-name="${field.name}">`;
                html += `<label class="block text-sm font-medium text-gray-700 mb-1">${field.label}${requiredMark}</label>`;

                switch (field.type) {
                    case 'text':
                    case 'email':
                        html += `<input type="${field.type}" name="${field.name}" placeholder="${field.placeholder || ''}" 
                                        value="${field.defaultValue || ''}" 
                                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">`;
                        break;
                    case 'number':
                        html += `<input type="number" name="${field.name}" placeholder="${field.placeholder || ''}" 
                                        value="${field.defaultValue || ''}" 
                                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">`;
                        break;
                    case 'textarea':
                        html += `<textarea name="${field.name}" placeholder="${field.placeholder || ''}" 
                                           rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">${field.defaultValue || ''}</textarea>`;
                        break;
                    case 'select':
                        html += `<select name="${field.name}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                    <option value="">请选择...</option>
                                    ${(field.options || []).map(opt => `<option value="${opt.value}" ${field.defaultValue === opt.value ? 'selected' : ''}>${opt.label}</option>`).join('')}
                                 </select>`;
                        break;
                    case 'radio':
                        html += `<div class="space-y-2">
                                    ${(field.options || []).map(opt => `
                                        <label class="flex items-center">
                                            <input type="radio" name="${field.name}" value="${opt.value}" 
                                                   ${field.defaultValue === opt.value ? 'checked' : ''} 
                                                   class="mr-2 text-purple-600 focus:ring-purple-500">
                                            <span class="text-gray-700">${opt.label}</span>
                                        </label>
                                    `).join('')}
                                 </div>`;
                        break;
                    case 'checkbox':
                        html += `<div class="space-y-2">
                                    ${(field.options || []).map(opt => `
                                        <label class="flex items-center">
                                            <input type="checkbox" name="${field.name}" value="${opt.value}" 
                                                   class="mr-2 text-purple-600 focus:ring-purple-500 rounded">
                                            <span class="text-gray-700">${opt.label}</span>
                                        </label>
                                    `).join('')}
                                 </div>`;
                        break;
                    case 'date':
                        html += `<input type="date" name="${field.name}" value="${field.defaultValue || ''}" 
                                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">`;
                        break;
                    case 'file':
                        html += `<input type="file" name="${field.name}" 
                                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">`;
                        break;
                }

                html += `</div>`;
            });

            html += `
                <div class="flex justify-end space-x-4 pt-6">
                    <button type="button" onclick="closePreview()" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                        取消
                    </button>
                    <button type="button" onclick="testPreviewSubmit()" class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                        测试提交
                    </button>
                </div>
            </form>
            `;

            return html;
        }

        function testPreviewSubmit() {
            const form = document.getElementById('previewForm');
            const formData = new FormData(form);
            const data = {};
            
            formData.forEach((value, key) => {
                if (data[key]) {
                    if (Array.isArray(data[key])) {
                        data[key].push(value);
                    } else {
                        data[key] = [data[key], value];
                    }
                } else {
                    data[key] = value;
                }
            });

            console.log('Form data:', data);
            alert('表单数据已收集到控制台！\n\n' + JSON.stringify(data, null, 2));
        }

        function closePreview() {
            document.getElementById('previewModal').classList.add('hidden');
        }

        document.getElementById('previewModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePreview();
            }
        });
    </script>
</body>
</html>
