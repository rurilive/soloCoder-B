<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转字符画工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #1e1e1e;
            color: #d4d4d4;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #3c3c3c;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-details {
            text-align: right;
        }

        .username {
            color: #4ec9b0;
            font-weight: bold;
            font-size: 1.1em;
        }

        .usage-info {
            font-size: 0.85em;
            color: #858585;
        }

        .usage-info span {
            color: #4ec9b0;
        }

        .admin-link {
            color: #d4a940;
            text-decoration: none;
            padding: 5px 10px;
            border: 1px solid #d4a940;
            border-radius: 4px;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .admin-link:hover {
            background-color: #d4a940;
            color: #1e1e1e;
        }

        .logout-btn {
            background-color: #c74f4f;
            color: #d4d4d4;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background-color: #d85f5f;
        }

        h1 {
            color: #4ec9b0;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .upload-section {
            background-color: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed #3c3c3c;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #4ec9b0;
            background-color: #2d2d2d;
        }

        .upload-area.dragover {
            border-color: #4ec9b0;
            background-color: #323233;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #858585;
            font-size: 1.1em;
        }

        #fileInput {
            display: none;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            margin-top: 20px;
        }

        .option-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            color: #d4d4d4;
            font-size: 0.95em;
        }

        input[type="number"] {
            background-color: #3c3c3c;
            border: 1px solid #4c4c4c;
            color: #d4d4d4;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 1em;
            width: 80px;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #4ec9b0;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .convert-btn {
            background-color: #4ec9b0;
            color: #1e1e1e;
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .convert-btn:hover {
            background-color: #5edcc1;
            transform: translateY(-2px);
        }

        .convert-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
            transform: none;
        }

        .result-section {
            background-color: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            padding: 30px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .result-title {
            color: #4ec9b0;
            font-size: 1.3em;
            font-weight: bold;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background-color: #3c3c3c;
            color: #d4d4d4;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .action-btn:hover {
            background-color: #4c4c4c;
        }

        .ascii-output {
            background-color: #1e1e1e;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            padding: 20px;
            overflow-x: auto;
            white-space: pre;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.2;
            color: #d4d4d4;
            max-height: 600px;
            overflow-y: auto;
        }

        .error-message {
            background-color: #4c2020;
            border: 1px solid #f48771;
            color: #f48771;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            display: none;
        }

        .file-info {
            background-color: #2d2d2d;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            padding: 10px 15px;
            margin-top: 15px;
            display: none;
        }

        .file-name {
            color: #4ec9b0;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .options {
                flex-direction: column;
                align-items: flex-start;
            }

            .convert-btn {
                width: 100%;
            }

            h1 {
                font-size: 2em;
            }

            .result-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .action-buttons {
                width: 100%;
            }

            .action-btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>图片转字符画工具</h1>
            <div class="user-info">
                <div class="user-details" id="userDetails">
                    <div class="username" id="usernameDisplay"></div>
                    <div class="usage-info" id="usageDisplay"></div>
                </div>
                <a href="/admin" class="admin-link" id="adminLink" style="display: none;">用户管理</a>
                <button class="logout-btn" id="logoutBtn">退出登录</button>
            </div>
        </div>
        
        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📷</div>
                <div class="upload-text">点击或拖拽图片到此处上传</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            
            <div class="file-info" id="fileInfo">
                <span>已选择: </span>
                <span class="file-name" id="fileName"></span>
            </div>
            
            <div class="options">
                <div class="option-group">
                    <label for="width">字符画宽度:</label>
                    <input type="number" id="width" value="100" min="50" max="200">
                </div>
                
                <div class="option-group">
                    <input type="checkbox" id="invert">
                    <label for="invert">反转颜色</label>
                </div>
                
                <button class="convert-btn" id="convertBtn" disabled>转换为字符画</button>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
        </div>
        
        <div class="result-section" id="resultSection" style="display: none;">
            <div class="result-header">
                <div class="result-title">转换结果</div>
                <div class="action-buttons">
                    <button class="action-btn" id="copyBtn">复制到剪贴板</button>
                    <button class="action-btn" id="downloadBtn">下载文本</button>
                </div>
            </div>
            <div class="ascii-output" id="asciiOutput"></div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const asciiOutput = document.getElementById('asciiOutput');
        const resultSection = document.getElementById('resultSection');
        const errorMessage = document.getElementById('errorMessage');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const widthInput = document.getElementById('width');
        const invertCheckbox = document.getElementById('invert');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const usernameDisplay = document.getElementById('usernameDisplay');
        const usageDisplay = document.getElementById('usageDisplay');
        const adminLink = document.getElementById('adminLink');
        const logoutBtn = document.getElementById('logoutBtn');

        let selectedFile = null;
        let currentAsciiArt = '';

        async function loadUserInfo() {
            try {
                const response = await fetch('/api/user/info', {
                    credentials: 'same-origin'
                });
                if (response.ok) {
                    const user = await response.json();
                    usernameDisplay.textContent = '欢迎, ' + user.username;
                    if (user.usage_limit === -1) {
                        usageDisplay.innerHTML = '使用次数: <span>' + user.usage_count + '</span> / <span>无限</span>';
                    } else {
                        usageDisplay.innerHTML = '使用次数: <span>' + user.usage_count + '</span> / <span>' + user.usage_limit + '</span>';
                    }
                    if (user.is_admin) {
                        adminLink.style.display = 'inline-block';
                    }
                } else if (response.status === 401) {
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('获取用户信息失败:', error);
            }
        }

        logoutBtn.addEventListener('click', () => {
            window.location.href = '/logout';
        });

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('请选择有效的图片文件');
                return;
            }
            
            selectedFile = file;
            fileName.textContent = file.name;
            fileInfo.style.display = 'block';
            convertBtn.disabled = false;
            hideError();
        }

        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) {
                showError('请先选择图片');
                return;
            }

            const formData = new FormData();
            formData.append('image', selectedFile);
            formData.append('width', widthInput.value);
            formData.append('invert', invertCheckbox.checked);

            try {
                convertBtn.disabled = true;
                convertBtn.textContent = '转换中...';
                hideError();

                const response = await fetch('/convert', {
                    method: 'POST',
                    credentials: 'same-origin',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    currentAsciiArt = result.ascii_art;
                    asciiOutput.textContent = currentAsciiArt;
                    resultSection.style.display = 'block';
                    
                    if (result.usage_count !== undefined && result.usage_limit !== undefined) {
                        if (result.usage_limit === -1) {
                            usageDisplay.innerHTML = '使用次数: <span>' + result.usage_count + '</span> / <span>无限</span>';
                        } else {
                            usageDisplay.innerHTML = '使用次数: <span>' + result.usage_count + '</span> / <span>' + result.usage_limit + '</span>';
                        }
                    }
                } else {
                    if (response.status === 401) {
                        window.location.href = '/';
                        return;
                    }
                    showError(result.error || '转换失败');
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
            } finally {
                convertBtn.disabled = false;
                convertBtn.textContent = '转换为字符画';
            }
        });

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(currentAsciiArt);
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '已复制!';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            } catch (error) {
                showError('复制失败: ' + error.message);
            }
        });

        downloadBtn.addEventListener('click', () => {
            const blob = new Blob([currentAsciiArt], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ascii_art.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        loadUserInfo();
    </script>
</body>
</html>
