<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试表单 - {{ form.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .screenshot-container {
            max-height: 400px;
            overflow: auto;
        }
        .screenshot-container img {
            max-width: 100%;
            height: auto;
        }
        .step-log {
            font-family: monospace;
            font-size: 12px;
        }
        .step-status-running {
            color: #f59e0b;
        }
        .step-status-success {
            color: #10b981;
        }
        .step-status-warning {
            color: #f59e0b;
        }
        .step-status-error {
            color: #ef4444;
        }
        .code-block {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            background-color: #1f2937;
            color: #e5e7eb;
            padding: 16px;
            border-radius: 8px;
            max-height: 500px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-6xl mx-auto">
            <!-- 头部导航 -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden mb-6">
                <div class="bg-gradient-to-r from-purple-600 to-indigo-600 px-8 py-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <a href="{{ url_for('index') }}" class="text-purple-200 hover:text-white text-sm mb-2 inline-block">
                                <i class="fas fa-arrow-left mr-1"></i>返回表单列表
                            </a>
                            <h1 class="text-3xl font-bold text-white">{{ form.name }}</h1>
                            {% if form.description %}
                            <p class="text-purple-200 mt-1">{{ form.description }}</p>
                            {% endif %}
                        </div>
                        <div class="flex space-x-3">
                            <a href="{{ url_for('view_form', form_id=form.id) }}" 
                               class="px-4 py-2 bg-white text-purple-600 rounded-lg hover:bg-purple-50 transition">
                                <i class="fas fa-eye mr-1"></i>预览表单
                            </a>
                            <a href="{{ url_for('designer') }}?edit={{ form.id }}" 
                               class="px-4 py-2 bg-white text-purple-600 rounded-lg hover:bg-purple-50 transition">
                                <i class="fas fa-edit mr-1"></i>编辑表单
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 主内容区域 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- 左侧：测试数据配置 -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h2 class="text-lg font-bold text-gray-800 mb-4">
                            <i class="fas fa-sliders-h mr-2 text-purple-600"></i>测试数据配置
                        </h2>
                        
                        <div id="testDataForm" class="space-y-4">
                            <!-- 动态生成测试数据字段 -->
                        </div>

                        <div class="mt-6 space-y-3">
                            <button onclick="runPlaywrightTest()" 
                                    class="w-full px-4 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-medium">
                                <i class="fas fa-play mr-2"></i>运行 Playwright 测试
                            </button>
                            <button onclick="generateTestCode()" 
                                    class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">
                                <i class="fas fa-code mr-2"></i>生成测试代码
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 右侧：测试结果 -->
                <div class="lg:col-span-2">
                    <!-- 执行日志 -->
                    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
                        <h2 class="text-lg font-bold text-gray-800 mb-4">
                            <i class="fas fa-terminal mr-2 text-purple-600"></i>执行日志
                        </h2>
                        <div id="testSteps" class="step-log bg-gray-50 rounded-lg p-4 min-h-[200px] max-h-[300px] overflow-y-auto">
                            <p class="text-gray-400">运行测试后，执行日志将显示在这里...</p>
                        </div>
                    </div>

                    <!-- 截图展示 -->
                    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
                        <h2 class="text-lg font-bold text-gray-800 mb-4">
                            <i class="fas fa-camera mr-2 text-purple-600"></i>测试截图
                        </h2>
                        <div id="screenshotTabs" class="hidden mb-4">
                            <div class="flex space-x-2 border-b border-gray-200 pb-2">
                                <!-- 动态生成标签 -->
                            </div>
                        </div>
                        <div id="screenshotContent" class="screenshot-container bg-gray-50 rounded-lg p-4 min-h-[200px] flex items-center justify-center">
                            <p class="text-gray-400">运行测试后，截图将显示在这里...</p>
                        </div>
                    </div>

                    <!-- 生成的代码 -->
                    <div id="codeSection" class="bg-white rounded-xl shadow-lg p-6 hidden">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-lg font-bold text-gray-800">
                                <i class="fas fa-file-code mr-2 text-purple-600"></i>生成的测试代码
                            </h2>
                            <button onclick="copyTestCode()" 
                                    class="px-3 py-1 text-sm bg-gray-100 text-gray-700 rounded hover:bg-gray-200 transition">
                                <i class="fas fa-copy mr-1"></i>复制代码
                            </button>
                        </div>
                        <div id="generatedCode" class="code-block">
                            <!-- 生成的代码将显示在这里 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const formData = {{ form.to_dict() | tojson }};
        const fields = formData.schema.fields || [];
        let currentScreenshots = {};

        // 初始化测试数据表单
        function initTestDataForm() {
            const container = document.getElementById('testDataForm');
            container.innerHTML = '';

            fields.forEach(field => {
                const fieldName = field.name;
                const fieldType = field.type;
                const fieldLabel = field.label || fieldName;

                let inputHtml = '';

                switch (fieldType) {
                    case 'text':
                    case 'email':
                        inputHtml = `
                            <input type="${fieldType}" 
                                   id="test_${fieldName}" 
                                   name="${fieldName}"
                                   placeholder="输入测试值"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        `;
                        break;
                    case 'number':
                        inputHtml = `
                            <input type="number" 
                                   id="test_${fieldName}" 
                                   name="${fieldName}"
                                   placeholder="输入数字"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        `;
                        break;
                    case 'textarea':
                        inputHtml = `
                            <textarea id="test_${fieldName}" 
                                      name="${fieldName}"
                                      placeholder="输入测试文本"
                                      rows="3"
                                      class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"></textarea>
                        `;
                        break;
                    case 'select':
                    case 'radio':
                        const options = field.options || [];
                        inputHtml = `
                            <select id="test_${fieldName}" 
                                    name="${fieldName}"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                <option value="">-- 选择测试值 --</option>
                                ${options.map(opt => `<option value="${opt.value}">${opt.label}</option>`).join('')}
                            </select>
                        `;
                        break;
                    case 'checkbox':
                        const checkOptions = field.options || [];
                        inputHtml = `
                            <div class="space-y-2">
                                ${checkOptions.map(opt => `
                                    <label class="flex items-center">
                                        <input type="checkbox" 
                                               class="test_${fieldName}" 
                                               value="${opt.value}"
                                               class="mr-2 text-purple-600 focus:ring-purple-500 rounded">
                                        <span class="text-sm text-gray-700">${opt.label}</span>
                                    </label>
                                `).join('')}
                            </div>
                        `;
                        break;
                    case 'date':
                        inputHtml = `
                            <input type="date" 
                                   id="test_${fieldName}" 
                                   name="${fieldName}"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        `;
                        break;
                    case 'file':
                        inputHtml = `
                            <p class="text-sm text-gray-500 italic">文件上传字段暂不支持自动化测试</p>
                        `;
                        break;
                }

                container.innerHTML += `
                    <div class="form-group">
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            ${fieldLabel}
                            <span class="text-gray-400 text-xs">(${fieldType})</span>
                        </label>
                        ${inputHtml}
                    </div>
                `;
            });
        }

        // 收集测试数据
        function collectTestData() {
            const testData = {};

            fields.forEach(field => {
                const fieldName = field.name;
                const fieldType = field.type;

                if (fieldType === 'checkbox') {
                    const checkboxes = document.querySelectorAll(`.test_${fieldName}:checked`);
                    const values = Array.from(checkboxes).map(cb => cb.value);
                    if (values.length > 0) {
                        testData[fieldName] = values;
                    }
                } else if (fieldType === 'file') {
                    // 跳过文件上传
                } else {
                    const input = document.getElementById(`test_${fieldName}`);
                    if (input && input.value) {
                        testData[fieldName] = input.value;
                    }
                }
            });

            return testData;
        }

        // 运行 Playwright 测试
        async function runPlaywrightTest() {
            const testData = collectTestData();
            const stepsContainer = document.getElementById('testSteps');
            
            stepsContainer.innerHTML = `
                <div class="step-status-running">
                    <i class="fas fa-spinner fa-spin mr-2"></i>准备执行 Playwright 测试...
                </div>
            `;

            try {
                const response = await fetch('/api/test/playwright', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        form_id: formData.id,
                        test_data: testData
                    })
                });

                const result = await response.json();
                displayTestResult(result);

            } catch (error) {
                stepsContainer.innerHTML = `
                    <div class="step-status-error">
                        <i class="fas fa-times-circle mr-2"></i>测试执行失败: ${error.message}
                    </div>
                `;
            }
        }

        // 显示测试结果
        function displayTestResult(result) {
            const stepsContainer = document.getElementById('testSteps');
            let stepsHtml = '';

            result.steps.forEach(step => {
                const iconClass = {
                    'running': 'fa-spinner fa-spin',
                    'success': 'fa-check-circle',
                    'warning': 'fa-exclamation-triangle',
                    'error': 'fa-times-circle'
                }[step.status] || 'fa-circle';

                stepsHtml += `
                    <div class="step-status-${step.status} py-1">
                        <i class="fas ${iconClass} mr-2"></i>${step.message}
                    </div>
                `;
            });

            stepsHtml += `
                <div class="mt-3 pt-3 border-t border-gray-200 ${result.success ? 'step-status-success' : 'step-status-error'}">
                    <i class="fas ${result.success ? 'fa-check-circle' : 'fa-times-circle'} mr-2"></i>
                    ${result.message}
                </div>
            `;

            stepsContainer.innerHTML = stepsHtml;

            // 显示截图
            if (result.screenshots && result.screenshots.length > 0) {
                currentScreenshots = {};
                result.screenshots.forEach(s => {
                    currentScreenshots[s.name] = s.data;
                });
                displayScreenshots(result.screenshots);
            }
        }

        // 显示截图
        function displayScreenshots(screenshots) {
            const tabsContainer = document.getElementById('screenshotTabs');
            const contentContainer = document.getElementById('screenshotContent');
            const tabsInner = tabsContainer.querySelector('div');

            tabsContainer.classList.remove('hidden');
            tabsInner.innerHTML = '';

            screenshots.forEach((screenshot, index) => {
                const tabName = {
                    'initial_load': '页面加载',
                    'after_fill': '填写完成',
                    'after_submit': '提交后',
                    'error': '错误截图'
                }[screenshot.name] || screenshot.name;

                tabsInner.innerHTML += `
                    <button onclick="showScreenshot('${screenshot.name}')" 
                            class="px-3 py-1 text-sm ${index === 0 ? 'bg-purple-100 text-purple-700' : 'text-gray-600 hover:text-gray-800'} rounded transition"
                            data-screenshot="${screenshot.name}">
                        ${tabName}
                    </button>
                `;
            });

            // 显示第一个截图
            if (screenshots.length > 0) {
                showScreenshot(screenshots[0].name);
            }
        }

        // 显示指定截图
        function showScreenshot(name) {
            const contentContainer = document.getElementById('screenshotContent');
            const tabs = document.querySelectorAll('#screenshotTabs button');

            // 更新标签样式
            tabs.forEach(tab => {
                if (tab.dataset.screenshot === name) {
                    tab.classList.remove('text-gray-600', 'hover:text-gray-800');
                    tab.classList.add('bg-purple-100', 'text-purple-700');
                } else {
                    tab.classList.remove('bg-purple-100', 'text-purple-700');
                    tab.classList.add('text-gray-600', 'hover:text-gray-800');
                }
            });

            // 显示截图
            if (currentScreenshots[name]) {
                contentContainer.innerHTML = `
                    <img src="data:image/png;base64,${currentScreenshots[name]}" 
                         alt="Screenshot: ${name}"
                         class="max-w-full rounded shadow">
                `;
            }
        }

        // 生成测试代码
        async function generateTestCode() {
            try {
                const response = await fetch(`/api/test/generate-code/${formData.id}`);
                const result = await response.json();

                const codeSection = document.getElementById('codeSection');
                const codeContainer = document.getElementById('generatedCode');

                codeSection.classList.remove('hidden');
                codeContainer.textContent = result.code;
                
                // 滚动到代码区域
                codeSection.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                alert('生成代码失败: ' + error.message);
            }
        }

        // 复制测试代码
        function copyTestCode() {
            const codeContainer = document.getElementById('generatedCode');
            const code = codeContainer.textContent;

            navigator.clipboard.writeText(code).then(() => {
                alert('代码已复制到剪贴板！');
            }).catch(err => {
                console.error('复制失败:', err);
                alert('复制失败，请手动复制');
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initTestDataForm();
        });
    </script>
</body>
</html>
