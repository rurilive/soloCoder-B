<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试表单 - {{ form.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .code-block {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            background-color: #1f2937;
            color: #e5e7eb;
            padding: 16px;
            border-radius: 8px;
            max-height: 500px;
            overflow: auto;
        }
        .step-log {
            font-family: monospace;
            font-size: 12px;
        }
        .step-status-running {
            color: #f59e0b;
        }
        .step-status-success {
            color: #10b981;
        }
        .step-status-warning {
            color: #f59e0b;
        }
        .step-status-error {
            color: #ef4444;
        }
        .tab-button.active {
            background-color: #667eea;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-6xl mx-auto">
            <!-- 头部导航 -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden mb-6">
                <div class="bg-gradient-to-r from-purple-600 to-indigo-600 px-8 py-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <a href="{{ url_for('index') }}" class="text-purple-200 hover:text-white text-sm mb-2 inline-block">
                                <i class="fas fa-arrow-left mr-1"></i>返回表单列表
                            </a>
                            <h1 class="text-3xl font-bold text-white">{{ form.name }}</h1>
                            {% if form.description %}
                            <p class="text-purple-200 mt-1">{{ form.description }}</p>
                            {% endif %}
                        </div>
                        <div class="flex space-x-3">
                            <a href="{{ url_for('view_form', form_id=form.id) }}" 
                               class="px-4 py-2 bg-white text-purple-600 rounded-lg hover:bg-purple-50 transition">
                                <i class="fas fa-eye mr-1"></i>预览表单
                            </a>
                            <a href="{{ url_for('designer') }}?edit={{ form.id }}" 
                               class="px-4 py-2 bg-white text-purple-600 rounded-lg hover:bg-purple-50 transition">
                                <i class="fas fa-edit mr-1"></i>编辑表单
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 测试说明 -->
            <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4">
                    <i class="fas fa-info-circle mr-2 text-purple-600"></i>测试方式说明
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="p-4 bg-green-50 rounded-lg border border-green-200">
                        <h3 class="font-bold text-green-800 mb-2">
                            <i class="fas fa-bolt mr-2"></i>API 测试（推荐）
                        </h3>
                        <p class="text-sm text-green-700">
                            直接调用后端 API 进行数据验证和提交测试。快速、稳定，不需要浏览器。
                        </p>
                    </div>
                    <div class="p-4 bg-blue-50 rounded-lg border border-blue-200">
                        <h3 class="font-bold text-blue-800 mb-2">
                            <i class="fas fa-code mr-2"></i>生成测试代码
                        </h3>
                        <p class="text-sm text-blue-700">
                            自动生成 Python 测试代码，包括 API 测试代码和 Playwright 端到端测试代码。
                        </p>
                    </div>
                </div>
            </div>

            <!-- 主内容区域 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- 左侧：测试数据配置 -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h2 class="text-lg font-bold text-gray-800 mb-4">
                            <i class="fas fa-sliders-h mr-2 text-purple-600"></i>测试数据配置
                        </h2>
                        
                        <div id="testDataForm" class="space-y-4">
                            <!-- 动态生成测试数据字段 -->
                        </div>

                        <div class="mt-6 space-y-3">
                            <button onclick="runApiTest()" 
                                    class="w-full px-4 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-medium">
                                <i class="fas fa-play mr-2"></i>运行 API 测试
                            </button>
                            <button onclick="generateTestCode()" 
                                    class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">
                                <i class="fas fa-code mr-2"></i>生成测试代码
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 右侧：测试结果 -->
                <div class="lg:col-span-2">
                    <!-- 执行日志 -->
                    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
                        <h2 class="text-lg font-bold text-gray-800 mb-4">
                            <i class="fas fa-terminal mr-2 text-purple-600"></i>执行日志
                        </h2>
                        <div id="testSteps" class="step-log bg-gray-50 rounded-lg p-4 min-h-[150px] max-h-[300px] overflow-y-auto">
                            <p class="text-gray-400">运行测试后，执行日志将显示在这里...</p>
                        </div>
                    </div>

                    <!-- 验证结果 -->
                    <div id="validationResult" class="bg-white rounded-xl shadow-lg p-6 mb-6 hidden">
                        <h2 class="text-lg font-bold text-gray-800 mb-4">
                            <i class="fas fa-check-circle mr-2 text-purple-600"></i>验证结果
                        </h2>
                        <div id="validationContent"></div>
                    </div>

                    <!-- 生成的代码 -->
                    <div id="codeSection" class="bg-white rounded-xl shadow-lg p-6 hidden">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-lg font-bold text-gray-800">
                                <i class="fas fa-file-code mr-2 text-purple-600"></i>生成的测试代码
                            </h2>
                        </div>

                        <!-- 代码类型标签 -->
                        <div class="flex space-x-2 mb-4">
                            <button onclick="showCodeTab('api')" 
                                    id="tabApi"
                                    class="tab-button px-4 py-2 rounded-lg text-sm font-medium active">
                                <i class="fas fa-bolt mr-1"></i>API 测试代码
                            </button>
                            <button onclick="showCodeTab('playwright')" 
                                    id="tabPlaywright"
                                    class="tab-button px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200">
                                <i class="fas fa-globe mr-1"></i>Playwright 测试代码
                            </button>
                        </div>

                        <div class="flex justify-end space-x-2 mb-3">
                            <button onclick="copyCurrentCode()" 
                                    class="px-3 py-1 text-sm bg-gray-100 text-gray-700 rounded hover:bg-gray-200 transition">
                                <i class="fas fa-copy mr-1"></i>复制代码
                            </button>
                            <button onclick="downloadCurrentCode()" 
                                    class="px-3 py-1 text-sm bg-gray-100 text-gray-700 rounded hover:bg-gray-200 transition">
                                <i class="fas fa-download mr-1"></i>下载代码
                            </button>
                        </div>

                        <div id="codeContentApi" class="tab-content active">
                            <div id="generatedCodeApi" class="code-block"></div>
                        </div>
                        <div id="codeContentPlaywright" class="tab-content">
                            <div id="generatedCodePlaywright" class="code-block"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const formData = {{ form.to_dict() | tojson }};
        const fields = formData.schema.fields || [];
        let currentCodeApi = '';
        let currentCodePlaywright = '';
        let currentTab = 'api';

        // 初始化测试数据表单
        function initTestDataForm() {
            const container = document.getElementById('testDataForm');
            container.innerHTML = '';

            if (fields.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-400">
                        <i class="fas fa-inbox text-4xl mb-3"></i>
                        <p>该表单暂无字段</p>
                    </div>
                `;
                return;
            }

            fields.forEach(field => {
                const fieldName = field.name;
                const fieldType = field.type;
                const fieldLabel = field.label || fieldName;
                const isRequired = field.required || false;

                let inputHtml = '';

                switch (fieldType) {
                    case 'text':
                    case 'email':
                        inputHtml = `
                            <input type="${fieldType}" 
                                   id="test_${fieldName}" 
                                   name="${fieldName}"
                                   placeholder="输入测试值"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        `;
                        break;
                    case 'number':
                        inputHtml = `
                            <input type="number" 
                                   id="test_${fieldName}" 
                                   name="${fieldName}"
                                   placeholder="输入数字"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        `;
                        break;
                    case 'textarea':
                        inputHtml = `
                            <textarea id="test_${fieldName}" 
                                      name="${fieldName}"
                                      placeholder="输入测试文本"
                                      rows="3"
                                      class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"></textarea>
                        `;
                        break;
                    case 'select':
                    case 'radio':
                        const options = field.options || [];
                        inputHtml = `
                            <select id="test_${fieldName}" 
                                    name="${fieldName}"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                <option value="">-- 选择测试值 --</option>
                                ${options.map(opt => `<option value="${opt.value}">${opt.label}</option>`).join('')}
                            </select>
                        `;
                        break;
                    case 'checkbox':
                        const checkOptions = field.options || [];
                        inputHtml = `
                            <div class="space-y-2">
                                ${checkOptions.map(opt => `
                                    <label class="flex items-center">
                                        <input type="checkbox" 
                                               class="test_${fieldName}" 
                                               value="${opt.value}"
                                               class="mr-2 text-purple-600 focus:ring-purple-500 rounded">
                                        <span class="text-sm text-gray-700">${opt.label}</span>
                                    </label>
                                `).join('')}
                            </div>
                        `;
                        break;
                    case 'date':
                        inputHtml = `
                            <input type="date" 
                                   id="test_${fieldName}" 
                                   name="${fieldName}"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        `;
                        break;
                    case 'file':
                        inputHtml = `
                            <p class="text-sm text-gray-500 italic">文件上传字段暂不支持自动化测试</p>
                        `;
                        break;
                }

                container.innerHTML += `
                    <div class="form-group">
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            ${fieldLabel}
                            ${isRequired ? '<span class="text-red-500">*</span>' : ''}
                            <span class="text-gray-400 text-xs">(${fieldType})</span>
                        </label>
                        ${inputHtml}
                    </div>
                `;
            });
        }

        // 收集测试数据
        function collectTestData() {
            const testData = {};

            fields.forEach(field => {
                const fieldName = field.name;
                const fieldType = field.type;

                if (fieldType === 'checkbox') {
                    const checkboxes = document.querySelectorAll(`.test_${fieldName}:checked`);
                    const values = Array.from(checkboxes).map(cb => cb.value);
                    if (values.length > 0) {
                        testData[fieldName] = values;
                    }
                } else if (fieldType === 'file') {
                    // 跳过文件上传
                } else {
                    const input = document.getElementById(`test_${fieldName}`);
                    if (input && input.value !== undefined && input.value !== '') {
                        testData[fieldName] = input.value;
                    }
                }
            });

            return testData;
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function createStepElement(step, showSpinner = false) {
            const iconClass = {
                'running': 'fa-spinner fa-spin',
                'success': 'fa-check-circle',
                'warning': 'fa-exclamation-triangle',
                'error': 'fa-times-circle'
            }[step.status] || 'fa-circle';

            const div = document.createElement('div');
            div.className = `step-status-${step.status} py-1`;
            div.style.opacity = '0';
            div.style.transform = 'translateX(-20px)';
            div.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
            div.innerHTML = `<i class="fas ${iconClass} mr-2"></i>${step.message}`;
            return div;
        }

        function updateStepStatus(stepElement, newStatus) {
            const iconClass = {
                'running': 'fa-spinner fa-spin',
                'success': 'fa-check-circle',
                'warning': 'fa-exclamation-triangle',
                'error': 'fa-times-circle'
            }[newStatus] || 'fa-circle';

            stepElement.className = `step-status-${newStatus} py-1`;
            const icon = stepElement.querySelector('i');
            if (icon) {
                icon.className = `fas ${iconClass} mr-2`;
            }
        }

        function showStep(container, stepElement) {
            container.appendChild(stepElement);
            requestAnimationFrame(() => {
                stepElement.style.opacity = '1';
                stepElement.style.transform = 'translateX(0)';
            });
        }

        async function runApiTest() {
            const testData = collectTestData();
            const stepsContainer = document.getElementById('testSteps');
            const validationResult = document.getElementById('validationResult');
            const validationContent = document.getElementById('validationContent');
            
            stepsContainer.innerHTML = '';
            validationResult.classList.add('hidden');

            try {
                const step1 = createStepElement({
                    status: 'running',
                    message: '步骤 1/5: 准备执行 API 测试...'
                });
                showStep(stepsContainer, step1);
                await delay(500);

                updateStepStatus(step1, 'success');
                await delay(300);

                const step2 = createStepElement({
                    status: 'running',
                    message: `步骤 2/5: 收集测试数据...`
                });
                showStep(stepsContainer, step2);
                await delay(500);

                const testDataStr = JSON.stringify(testData, null, 2);
                const step2a = createStepElement({
                    status: 'warning',
                    message: `   测试数据: ${JSON.stringify(testData)}`
                });
                showStep(stepsContainer, step2a);
                await delay(400);

                updateStepStatus(step2, 'success');
                await delay(200);

                const step3 = createStepElement({
                    status: 'running',
                    message: '步骤 3/5: 正在发送请求到后端 API...'
                });
                showStep(stepsContainer, step3);

                const response = await fetch('/api/test/api', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        form_id: formData.id,
                        test_data: testData
                    })
                });

                updateStepStatus(step3, 'success');
                await delay(300);

                const step4 = createStepElement({
                    status: 'running',
                    message: '步骤 4/5: 正在解析响应数据...'
                });
                showStep(stepsContainer, step4);
                await delay(300);

                const result = await response.json();
                
                updateStepStatus(step4, 'success');
                await delay(200);

                const step5 = createStepElement({
                    status: 'running',
                    message: '步骤 5/5: 正在显示测试结果...'
                });
                showStep(stepsContainer, step5);
                await delay(400);

                await displayApiTestResultAnimated(result, stepsContainer);

                updateStepStatus(step5, 'success');

            } catch (error) {
                const errorStep = createStepElement({
                    status: 'error',
                    message: `测试执行失败: ${error.message}`
                });
                showStep(stepsContainer, errorStep);
            }
        }

        async function displayApiTestResultAnimated(result, stepsContainer) {
            const validationResult = document.getElementById('validationResult');
            const validationContent = document.getElementById('validationContent');

            for (let i = 0; i < result.steps.length; i++) {
                const step = result.steps[i];
                const stepElement = createStepElement(step);
                showStep(stepsContainer, stepElement);
                await delay(400);
            }

            await delay(300);

            const finalStep = createStepElement({
                status: result.success ? 'success' : 'error',
                message: result.message
            });
            finalStep.classList.add('mt-3', 'pt-3', 'border-t', 'border-gray-200');
            showStep(stepsContainer, finalStep);

            if (result.validation_result) {
                await delay(500);
                validationResult.classList.remove('hidden');
                
                if (result.validation_result.valid) {
                    validationContent.innerHTML = `
                        <div class="p-4 bg-green-50 rounded-lg border border-green-200" style="opacity: 0; transform: translateY(20px); transition: all 0.5s ease;">
                            <div class="flex items-center text-green-800">
                                <i class="fas fa-check-circle text-xl mr-3"></i>
                                <div>
                                    <h3 class="font-bold">数据验证通过</h3>
                                    <p class="text-sm">所有字段都符合验证规则</p>
                                </div>
                            </div>
                        </div>
                    `;
                    setTimeout(() => {
                        const el = validationContent.querySelector('div');
                        if (el) {
                            el.style.opacity = '1';
                            el.style.transform = 'translateY(0)';
                        }
                    }, 50);
                } else {
                    let errorHtml = `
                        <div class="p-4 bg-red-50 rounded-lg border border-red-200" style="opacity: 0; transform: translateY(20px); transition: all 0.5s ease;">
                            <div class="flex items-center text-red-800 mb-3">
                                <i class="fas fa-times-circle text-xl mr-3"></i>
                                <div>
                                    <h3 class="font-bold">数据验证失败</h3>
                                    <p class="text-sm">以下字段存在问题</p>
                                </div>
                            </div>
                            <div class="space-y-2">
                    `;

                    for (const [field, error] of Object.entries(result.validation_result.errors)) {
                        errorHtml += `
                            <div class="flex items-start text-red-700 text-sm">
                                <i class="fas fa-exclamation-circle mt-0.5 mr-2 flex-shrink-0"></i>
                                <span><strong>${field}:</strong> ${error}</span>
                            </div>
                        `;
                    }

                    errorHtml += `
                            </div>
                        </div>
                    `;
                    validationContent.innerHTML = errorHtml;
                    setTimeout(() => {
                        const el = validationContent.querySelector('div');
                        if (el) {
                            el.style.opacity = '1';
                            el.style.transform = 'translateY(0)';
                        }
                    }, 50);
                }
            }

            if (result.submission_id) {
                await delay(600);
                const submitDiv = document.createElement('div');
                submitDiv.style.marginTop = '1rem';
                submitDiv.style.opacity = '0';
                submitDiv.style.transform = 'translateY(20px)';
                submitDiv.style.transition = 'all 0.5s ease';
                submitDiv.innerHTML = `
                    <div class="p-4 bg-blue-50 rounded-lg border border-blue-200">
                        <div class="flex items-center text-blue-800">
                            <i class="fas fa-database text-xl mr-3"></i>
                            <div>
                                <h3 class="font-bold">数据已保存</h3>
                                <p class="text-sm">提交ID: ${result.submission_id}</p>
                            </div>
                        </div>
                    </div>
                `;
                validationContent.appendChild(submitDiv);
                setTimeout(() => {
                    submitDiv.style.opacity = '1';
                    submitDiv.style.transform = 'translateY(0)';
                }, 50);
            }
        }

        function displayApiTestResult(result) {
            displayApiTestResultAnimated(result, document.getElementById('testSteps'));
        }

        async function generateTestCode() {
            const codeSection = document.getElementById('codeSection');
            const stepsContainer = document.getElementById('testSteps');
            
            stepsContainer.innerHTML = '';

            try {
                const step1 = createStepElement({
                    status: 'running',
                    message: '步骤 1/4: 准备生成测试代码...'
                });
                showStep(stepsContainer, step1);
                await delay(400);

                updateStepStatus(step1, 'success');
                await delay(200);

                const step2 = createStepElement({
                    status: 'running',
                    message: '步骤 2/4: 正在请求后端 API...'
                });
                showStep(stepsContainer, step2);

                const response = await fetch(`/api/test/generate-code/${formData.id}`);
                
                updateStepStatus(step2, 'success');
                await delay(200);

                const step3 = createStepElement({
                    status: 'running',
                    message: '步骤 3/4: 正在解析响应数据...'
                });
                showStep(stepsContainer, step3);
                await delay(300);

                const result = await response.json();
                
                updateStepStatus(step3, 'success');
                await delay(200);

                const step4 = createStepElement({
                    status: 'running',
                    message: '步骤 4/4: 正在显示生成的代码...'
                });
                showStep(stepsContainer, step4);
                await delay(300);

                currentCodeApi = result.api_test_code;
                currentCodePlaywright = result.playwright_test_code;

                document.getElementById('generatedCodeApi').textContent = currentCodeApi;
                document.getElementById('generatedCodePlaywright').textContent = currentCodePlaywright;

                codeSection.classList.remove('hidden');
                codeSection.scrollIntoView({ behavior: 'smooth' });

                updateStepStatus(step4, 'success');
                await delay(200);

                const successStep = createStepElement({
                    status: 'success',
                    message: `✅ 测试代码生成成功！生成时间: ${result.generated_at}`
                });
                successStep.classList.add('mt-3', 'pt-3', 'border-t', 'border-gray-200');
                showStep(stepsContainer, successStep);

            } catch (error) {
                const errorStep = createStepElement({
                    status: 'error',
                    message: `❌ 生成代码失败: ${error.message}`
                });
                errorStep.classList.add('mt-3', 'pt-3', 'border-t', 'border-gray-200');
                showStep(stepsContainer, errorStep);
            }
        }

        // 显示代码标签页
        function showCodeTab(tab) {
            currentTab = tab;

            const tabApi = document.getElementById('tabApi');
            const tabPlaywright = document.getElementById('tabPlaywright');
            const contentApi = document.getElementById('codeContentApi');
            const contentPlaywright = document.getElementById('codeContentPlaywright');

            if (tab === 'api') {
                tabApi.classList.add('active');
                tabPlaywright.classList.remove('active');
                tabPlaywright.classList.add('bg-gray-100', 'text-gray-700');
                contentApi.classList.add('active');
                contentPlaywright.classList.remove('active');
            } else {
                tabPlaywright.classList.add('active');
                tabApi.classList.remove('active');
                tabApi.classList.add('bg-gray-100', 'text-gray-700');
                contentPlaywright.classList.add('active');
                contentApi.classList.remove('active');
            }
        }

        // 复制当前代码
        function copyCurrentCode() {
            const code = currentTab === 'api' ? currentCodeApi : currentCodePlaywright;
            
            navigator.clipboard.writeText(code).then(() => {
                alert('代码已复制到剪贴板！');
            }).catch(err => {
                console.error('复制失败:', err);
                alert('复制失败，请手动复制');
            });
        }

        // 下载当前代码
        function downloadCurrentCode() {
            const code = currentTab === 'api' ? currentCodeApi : currentCodePlaywright;
            const suffix = currentTab === 'api' ? 'api_test' : 'playwright_test';
            const filename = `test_form_${formData.id}_${suffix}.py`;

            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            alert(`代码已下载: ${filename}`);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initTestDataForm();
        });
    </script>
</body>
</html>
